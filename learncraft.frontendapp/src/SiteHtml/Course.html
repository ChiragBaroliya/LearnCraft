<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Course Details</h2>
        <form>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="courseTitle" class="form-label">Course Title</label>
                    <input type="text" class="form-control" id="courseTitle" value="Intro to Python" required>
                </div>
                <div class="col-md-6">
                    <label for="courseCategory" class="form-label">Category</label>
                    <input type="text" class="form-control" id="courseCategory" value="Programming" required>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="instructor" class="form-label">Instructor</label>
                    <input type="text" class="form-control" id="instructor" value="Alice Smith" required>
                </div>
                <div class="col-md-6">
                    <label for="duration" class="form-label">Duration (hours)</label>
                    <input type="number" class="form-control" id="duration" value="10" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" rows="3" required>Learn Python basics in a structured way.</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Course</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
